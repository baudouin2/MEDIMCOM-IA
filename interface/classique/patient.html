<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MEDIMCOM IA · Patient</title>
<style>
:root { --fond:#FAF8F3; --carte:#FFFFFF; --texte:#1E2B31; --doux:#5A6A72; --trait:#E2DED4; --vert:#2E9B5F; --rouge:#E04F3A; --bleu:#2F80C0; }
* { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
body { margin:0; background:var(--fond); color:var(--texte); font:18px/1.3 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; padding-bottom:120px; }
header { display:flex; justify-content:flex-end; gap:6px; padding:8px 12px; }
header button { font:inherit; font-size:14px; border:1px solid var(--trait); background:#fff; border-radius:8px; padding:6px 10px; }
header button[aria-pressed="true"] { background:var(--texte); color:#fff; }
main { max-width:980px; margin:0 auto; padding:0 12px; }
.recu { background:var(--carte); border:3px solid var(--bleu); border-radius:20px; padding:14px; min-height:200px; display:flex; flex-direction:column; justify-content:center; }
.recu.nouveau { animation: eclat 1.2s ease-out 2; }
@keyframes eclat { 0% { box-shadow:0 0 0 0 rgba(47,128,192,.6); } 100% { box-shadow:0 0 0 18px rgba(47,128,192,0); } }
.bande { display:flex; flex-wrap:wrap; gap:10px; justify-content:center; }
.p { display:flex; flex-direction:column; align-items:center; gap:2px; }
.p img { width:120px; height:120px; } .p span { font-size:15px; color:var(--doux); min-height:1em; }
.attente { text-align:center; color:var(--doux); }
.attente img { width:90px; height:90px; opacity:.6; }
.question { display:flex; align-items:center; justify-content:center; gap:10px; margin:10px 0 0; }
.question img { width:56px; height:56px; animation: pulse 1.6s infinite; }
@keyframes pulse { 50% { transform:scale(1.12); } }
.anciens { display:flex; flex-direction:column; gap:6px; margin:10px 0; }
.anciens .bande { justify-content:flex-start; } .anciens img { width:44px; height:44px; }
.onglets { display:flex; gap:8px; margin:16px 0 8px; overflow-x:auto; }
.onglets button { border:3px solid transparent; background:var(--carte); border-radius:14px; padding:4px; }
.onglets button[aria-selected="true"] { border-color:var(--texte); }
.onglets img { width:64px; height:64px; display:block; }
.grille { display:grid; grid-template-columns:repeat(auto-fill, minmax(110px, 1fr)); gap:10px; }
.grille button { border:2px solid var(--trait); background:var(--carte); border-radius:16px; padding:6px; display:flex; flex-direction:column; align-items:center; min-height:110px; }
.grille button img { width:92px; height:92px; } .grille button span { font-size:14px; color:var(--doux); min-height:1em; }
.grille button:active { transform:scale(.96); }
.plateau { position:fixed; left:0; right:0; bottom:0; background:var(--carte); border-top:2px solid var(--trait); padding:8px 12px; display:flex; gap:10px; align-items:center; }
.choisis { flex:1; display:flex; gap:6px; overflow-x:auto; min-height:72px; align-items:center; }
.choisis img { width:64px; height:64px; cursor:pointer; }
.gros { border:0; border-radius:16px; padding:6px; width:84px; height:84px; display:flex; align-items:center; justify-content:center; }
.gros img { width:64px; height:64px; }
.envoyer { background:var(--vert); } .effacer { background:#EEE; } .combiner { background:#E7F1FB; } .urgence { background:var(--rouge); }
.gros svg { width:56px; height:56px; }
.gros:disabled { opacity:.35; }
.voile { position:fixed; inset:0; background:rgba(30,43,49,.55); display:flex; align-items:center; justify-content:center; z-index:9; }
.boite { background:#fff; border-radius:20px; padding:20px; text-align:center; }
.boite img { width:120px; height:120px; } .boite .bande button { border:0; background:none; }
.envoye { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; pointer-events:none; }
.envoye svg { width:200px; height:200px; animation: monte 1s ease-out forwards; }
@keyframes monte { from { opacity:1; transform:scale(.6); } to { opacity:0; transform:scale(1.2); } }
</style>
</head>
<body>
<header aria-label="Langue des étiquettes">
  <button data-lg="" aria-pressed="true" title="images seules">🖼</button>
  <button data-lg="fr" aria-pressed="false">FR</button>
  <button data-lg="en" aria-pressed="false">EN</button>
  <button data-lg="ar" aria-pressed="false">عربي</button>
</header>
<main>
  <div id="recu" class="recu" aria-live="polite"></div>
  <div id="anciens" class="anciens"></div>
  <nav class="onglets" id="onglets" role="tablist"></nav>
  <div class="grille" id="grille"></div>
</main>
<div class="plateau">
  <div class="choisis" id="choisis" aria-label="Ma réponse"></div>
  <!-- Icônes propres aux boutons (pas OUI / NON, qui sont des réponses) : flèche « retour arrière » et avion « envoyer ». -->
  <!-- « Combiner » : fusionne les deux derniers pictogrammes choisis en UNE image (ex. tête + douleur). -->
  <button class="gros combiner" id="combiner" aria-label="combiner les deux derniers pictogrammes"><svg viewBox="0 0 64 64" aria-hidden="true">
    <rect x="6" y="6" width="34" height="34" rx="7" fill="#fff" stroke="#2F80C0" stroke-width="4"/>
    <circle cx="42" cy="42" r="15" fill="#fff" stroke="#2F80C0" stroke-width="4"/>
    <path d="M42 34v16M34 42h16" stroke="#2F80C0" stroke-width="4" stroke-linecap="round"/></svg></button>
  <button class="gros effacer" id="effacer" aria-label="tout effacer"><svg viewBox="0 0 64 64" aria-hidden="true">
    <path d="M22 14h32a4 4 0 0 1 4 4v28a4 4 0 0 1-4 4H22L6 32z" fill="#fff" stroke="#5A6A72" stroke-width="4" stroke-linejoin="round"/>
    <path d="M30 24l16 16M46 24L30 40" stroke="#5A6A72" stroke-width="5" stroke-linecap="round"/></svg></button>
  <button class="gros envoyer" id="envoyer" aria-label="envoyer"><svg viewBox="0 0 64 64" aria-hidden="true">
    <path d="M6 30L58 8 44 56 32 38z" fill="#fff" stroke="#fff" stroke-width="3" stroke-linejoin="round"/>
    <path d="M32 38L58 8" stroke="#2E9B5F" stroke-width="4" stroke-linecap="round"/></svg></button>
  <button class="gros urgence" id="urgence" aria-label="urgence"><img src="/pictos/URGENCE.svg" alt=""></button>
</div>
<script>
const $ = id => document.getElementById(id);
const poser = (el, html) => { if (el._html !== html) { el.innerHTML = html; el._html = html; } };   // pas de clignotement
const src = id => `/pictos/${encodeURIComponent(id)}.svg`;
const ICONES_ONGLETS = {reponses:"OUI", corps:"TETE", symptomes:"DOULEUR", ressenti:"PEUR", intensite:"CHIFFRE:5", temps:"MATIN"};
let ONGLETS = [];
let langue = "", libelles = {}, palette = null, onglet = "reponses", choix = [], dernier = 0, session = null;
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
try { langue = localStorage.getItem("medimcom-langue") || ""; } catch (e) {}

const etiquette = id => !langue ? "" : id.includes("+") ? id.split("+").map(x => etiquette(x)).filter(Boolean).join(" + ")
  : (libelles[langue] && libelles[langue][id]) || "";
const carte = id => `<div class="p"><img src="${src(id)}" alt="${esc(etiquette(id) || id)}"><span ${langue==="ar"?'dir="rtl"':""}>${esc(etiquette(id))}</span></div>`;

function langueActive() {
  document.querySelectorAll("header button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.lg === langue)));
}
document.querySelectorAll("header button").forEach(b => b.onclick = () => {
  langue = b.dataset.lg; try { localStorage.setItem("medimcom-langue", langue); } catch (e) {}
  langueActive(); grille(); plateau(); rafraichir(true);
});

function grille() {
  if (!palette) return;
  poser($("onglets"), ONGLETS.map(([k, i]) => `<button role="tab" aria-selected="${k===onglet}" data-onglet="${k}"><img src="${src(i)}" alt="${k}"></button>`).join(""));
  poser($("grille"), palette[onglet].map(id => `<button data-picto="${esc(id)}" aria-label="${esc(etiquette(id) || id)}"><img src="${src(id)}" alt=""><span ${langue==="ar"?'dir="rtl"':""}>${esc(etiquette(id))}</span></button>`).join(""));
}
// mêmes règles que le serveur : 3 éléments au plus, pas de doublon, jamais la négation, la limite, l'urgence ou STOP
const JAMAIS_COMBINE = ["NE_PAS", "MAXIMUM", "URGENCE", "STOP"];
function combinable(a, b) {
  const parts = [...a.split("+"), ...b.split("+")];
  return parts.length <= 3 && new Set(parts).size === parts.length && !parts.some(x => JAMAIS_COMBINE.includes(x));
}
function plateau() {
  poser($("choisis"), choix.map((id, i) => `<img src="${src(id)}" alt="${esc(id)}" data-retirer="${i}">`).join(""));
  $("envoyer").disabled = $("effacer").disabled = !choix.length;
  $("combiner").disabled = !(choix.length >= 2 && combinable(choix[choix.length - 2], choix[choix.length - 1]));
}
$("combiner").onclick = () => {
  if (choix.length < 2) return;
  const b = choix.pop(), a = choix.pop();
  choix.push(combinable(a, b) ? `${a}+${b}` : a, ...(combinable(a, b) ? [] : [b]));
  plateau();
};
document.addEventListener("click", e => {
  const b = e.target.closest("[data-onglet],[data-picto],[data-retirer]"); if (!b) return;
  if (b.dataset.onglet) { onglet = b.dataset.onglet; grille(); }
  if (b.dataset.picto && choix.length < 12) { choix.push(b.dataset.picto); plateau(); }
  if (b.dataset.retirer !== undefined) { choix.splice(+b.dataset.retirer, 1); plateau(); }
});
async function envoyer(liste) {
  const r = await fetch("/api/patient/reponse", {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({pictogrammes: liste})});
  if (r.ok) {                        // confirmation visuelle : l'avion « envoyé » (pas le pictogramme OUI, qui est une réponse)
    const d = document.createElement("div"); d.className = "envoye";
    d.innerHTML = `<svg viewBox="0 0 64 64" width="200" height="200" aria-hidden="true"><circle cx="32" cy="32" r="30" fill="#2E9B5F"/>
      <path d="M14 31L50 16 41 50 32 38z" fill="#fff"/><path d="M32 38L50 16" stroke="#2E9B5F" stroke-width="3"/></svg>`;
    document.body.append(d); setTimeout(() => d.remove(), 1100);
  }
  choix = []; plateau(); rafraichir();
}
$("envoyer").onclick = () => choix.length && envoyer(choix.slice());
$("effacer").onclick = () => { choix = []; plateau(); };
$("urgence").onclick = () => {
  const v = document.createElement("div"); v.className = "voile";
  v.innerHTML = `<div class="boite"><img src="${src("URGENCE")}" alt="urgence"><img src="${src("QUESTION")}" alt="?" style="width:70px;height:70px">
    <div class="bande"><button id="urgOui" aria-label="oui"><img src="${src("OUI")}" alt=""></button><button id="urgNon" aria-label="non"><img src="${src("NON")}" alt=""></button></div></div>`;
  document.body.append(v);
  v.querySelector("#urgOui").onclick = () => { v.remove(); envoyer(["URGENCE"]); };
  v.querySelector("#urgNon").onclick = () => v.remove();
};

async function rafraichir(force) {
  let v; try { v = await (await fetch("/api/patient")).json(); } catch (e) { return; }
  if (!palette) { palette = v.palette; ONGLETS = Object.keys(palette).map(k => [k, palette[k].includes(ICONES_ONGLETS[k]) ? ICONES_ONGLETS[k] : palette[k][0]]); grille(); }
  if (session !== null && v.session !== session) {            // nouvelle consultation : on repart de zéro
    dernier = 0; choix = []; plateau(); poser($("anciens"), ""); $("recu")._html = null; force = true;
  }
  session = v.session;
  const msgs = v.messages, recu = $("recu");
  if (!msgs.length) {
    poser(recu, `<div class="attente"><img src="${src("ATTENDRE")}" alt="attendre"><br>${esc(etiquette("ATTENDRE"))}</div>`);
    dernier = 0;
  } else {
    const m = msgs[msgs.length - 1];
    if (m.id !== dernier || force) {
      recu._html = null;
      recu.innerHTML = `<div class="bande">${m.pictogrammes.map(id => carte(id)).join("")}</div>`
        + (v.attend_reponse ? `<div class="question"><img src="${src("QUESTION")}" alt="répondre"></div>` : "");
      if (m.id !== dernier) { recu.classList.remove("nouveau"); void recu.offsetWidth; recu.classList.add("nouveau"); }
      dernier = m.id;
      poser($("anciens"), msgs.slice(0, -1).reverse().slice(0, 4).map(x => `<div class="bande">${x.pictogrammes.map(id => `<img src="${src(id)}" alt="${esc(id)}">`).join("")}</div>`).join(""));
    }
  }
}
(async () => { try { libelles = await (await fetch("/api/libelles")).json(); } catch (e) {} langueActive(); plateau(); rafraichir(true); setInterval(rafraichir, 1500); })();
</script>
</body>
</html>
