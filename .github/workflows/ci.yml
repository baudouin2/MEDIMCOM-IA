# Continuous integration of MEDIMCOM IA: every change is tested and FORMALLY VERIFIED before being accepted.
name: verification
on: [push, pull_request]
jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -r requirements-dev.txt
      - name: Tests (unit, scenarios, interface, formal methods)
        run: python -m pytest -q
      - name: Knowledge-base consistency
        run: python kb/outils/verifier_kb.py
      - name: Formal verification (exhaustive enumeration, SMT proofs, exploration, monitor)
        run: python outils/verifier_formel.py --rapide
      - name: Agent evaluation bench (100 % safety required)
        run: python evaluer_agents.py
  interface:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
        working-directory: interface/web
      - name: TypeScript type check and build
        run: npm run build
        working-directory: interface/web
